name: "Cloud Infrastructure deployment process on PR"

on: 
  pull_request:
    types: [ opened ]

jobs:
  planning:
    name: "Infrastructure Plan"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2 # Change to your AWS region

      # 3. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2" # Set to match your local Terraform version

      # 4. Initialize Terraform working directory
      - name: Terraform Init
        run: terraform init

      # 5. Syntax check 
      - name: Terraform syntax Check
        run: terraform validate

      # 6. Run Terraform Plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan

      # 7. Uploads the terrafom plan output as an artifact so it can then be reused after approval
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  approval:
    name: "Manual approval"
    needs: planning
    runs-on: ubuntu-latest
    permissions:
      issues: write
      
    steps:

      # 1. Wait for approval before applying the changes to the infrastructure
      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1.10.0
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: DiegoAHF
          minimum-approvals: 1
          issue-title: "Approve Terraform Apply"
          issue-body: "Do you approve to apply the changes described in the plan output? Please respond with 'approved' to continue."
          
  apply:
    name: Infrastructure Apply
    needs: approval                           
    environment: test          #The infrastructure gets deployed to the test environment
    runs-on: ubuntu-latest
    
    steps:

    # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        
    # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2 # Change to your AWS region
          
    # 3. Setup Terraform CLI     
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          
    # 4. Initialize Terraform working directory
      - name: Terraform Init
        run: terraform init
        
    # 5. Downloads tfplan output to apply changes 
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          
    # 6. Apply the changes to the infrastructure
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan 

  automerge:
    name: Auto-Merge to main
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'pull_request'
    
    steps:

    # 1. Once the changes have been applied to the infrastructure, the files are merged to the main branch
      - name: Enable Auto-Merge via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash
